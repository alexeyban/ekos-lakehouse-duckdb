# The source: iDempiere on PostgreSQL (the `lh-source` service), through the read-only role.
connector.name=postgresql
connection-url=jdbc:postgresql://lh-source:5432/idempiere
connection-user=ekos_ro
connection-password=${ENV:SOURCE_PASSWORD}
# Required on every source catalog (ekos-lakehouse RFC 0192 §1): without them the connector
# silently drops columns of types it does not map.
postgresql.array-mapping=AS_ARRAY
unsupported-type-handling=CONVERT_TO_VARCHAR
